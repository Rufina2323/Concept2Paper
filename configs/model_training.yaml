data:
  dir: "data/link_prediction/llm_concept_datasets"
  train_file: "train.csv"
  val_file:   "val.csv"
  test_file:  "ranking_test.csv"
  ranking_test_file: "ranking_test.csv"

output_dir: "data/link_prediction/llm_concept_results"

models:

  # loss: "contrastive" | "bpr"
  #   contrastive: Hadsell 2006, per-sample, works with any batch
  #   bpr: Bayesian Personalised Ranking, pairwise, benefits from grouped batches

  # MLP — graph-topology (structure) features only
  mlp_structure:
    enabled: false
    seed: 42
    loss: "bpr"
    hidden_dims: [128, 64, 32]
    dropout: 0.3
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 1024
    epochs: 100
    patience: 10

  # MLP — sentence-embedding pair features (emb_* columns)
  mlp_emb:
    enabled: false
    seed: 42
    loss: "bpr"
    hidden_dims: [256, 128, 64]
    dropout: 0.3
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 1024
    epochs: 100
    patience: 10

  # MLP — graph-topology with sentence-embedding features (structure + emb)
  mlp_all:
    enabled: false
    seed: 42
    loss: "bpr"
    hidden_dims: [256, 128, 64]
    dropout: 0.3
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 1024
    epochs: 100
    patience: 10

  # 7. LightGBM — all features, LambdaRank
  lightgbm_all:
    enabled: false
    n_estimators: 500
    learning_rate: 0.02
    max_depth: 6
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.7
    colsample_bytree: 0.5
    early_stopping_rounds: 30
    n_jobs: 1

  # GNN + MLP
  gnn:
    enabled: true
    loss: "bpr"
    graph_file: "graph_2017_2022.pkl"   # train-window graph only
    embedding_dim: 64
    dnn_hidden_dim: 128
    gnn_dropout_rate: 0.3
    dnn_dropout_rate: 0.3
    learning_rate: 0.001
    weight_decay: 0.0001
    epochs: 100
    patience: 10

  # 8. XGBoost — all features, rank:ndcg
  xgboost_all:
    enabled: false
    n_estimators: 500
    learning_rate: 0.02
    max_depth: 6
    min_child_weight: 5
    subsample: 0.7
    colsample_bytree: 0.5
    colsample_bylevel: 0.9
    early_stopping_rounds: 30

evaluation:
  ranking:
    enabled: true
    k_values: [5, 10, 50, 100]
