general:
  input_file: "data/raw/accepted_iclr_articles.csv"    # CSV with columns: title, abstract
  output_dir: "data/extracted_concepts/"
  title_column: "title"
  abstract_column: "abstract"
  output_raw_concepts_column: "raw_concepts"
  output_concept_scores_column: "concept_scores"
  combine_title_abstract: true                # If true, concatenate title + abstract as input text
  separator: " . "                            # Separator when combining title and abstract

concept_extraction:
  methods: ["keybert", "rake", "yake", "llm"]     # Options: rake, keybert, yake, llm
  top_n: 10                                           # Default number of top concepts to extract per document

rake:
  language: "en"
  min_length: 1                 # Minimum keyword length (in words)
  max_length: 4                 # Maximum keyword length (in words)
  stopwords: null               # null = use default, or provide path to custom stopwords file
  top_n: 10

yake:
  language: "en"
  max_ngram_size: 3             # Maximum n-gram size for candidate keywords
  deduplication_threshold: 0.9  # Threshold for deduplication
  deduplication_algo: "seqm"    # Deduplication algorithm: "seqm", "levs", "jaro"
  window_size: 1                # Window size for co-occurrence
  num_of_keywords: 10           # Number of keywords to extract
  top_n: 10

keybert:
  model_name: "all-MiniLM-L6-v2"           # Sentence-transformer model
  keyphrase_ngram_range: [1, 3]            # N-gram range for keyphrases
  stop_words: "english"                    # Stop words
  use_maxsum: false                        # Use Max Sum Distance for diversity
  use_mmr: true                            # Use Maximal Marginal Relevance for diversity
  diversity: 0.7                           # Diversity parameter for MMR (0-1)
  nr_candidates: 20                        # Number of candidates for Max Sum
  top_n: 10
  seed_keywords: null                      # Optional list of seed keywords to guide extraction
  min_df: 1                                # Minimum document frequency for CountVectorizer

llm:
  provider: "openai"                       # Options: "openai"
  
  # OpenAI settings
  openai:
    model: "openai/gpt-oss-120b"
    api_key_env: "OPENAI_API_KEY"          # Environment variable name for API key
    temperature: 1.0
    reasoning: True
    
  system_prompt_template: |
    You are an expert scientific text analyst.

    Your task is to extract key scientific concepts, keywords, and domain-specific terms from a research paper's title and abstract.

    Guidelines:
    - Focus on meaningful scientific concepts (methods, theories, phenomena, materials, metrics, diseases, models, etc.).
    - Prefer specific, technical terms over generic words.
    - Avoid stopwords, filler words, and vague terms (e.g., "study", "result", "analysis").
    - Normalize concepts where appropriate (e.g., singular form, standard terminology).
    - Do not include duplicates.
    - Do not include explanations or extra text.

    Output format:
    - Return ONLY the concepts
    - One concept per line
    - Limit output to {top_n} concepts maximum
    - No numbering, no bullets, no additional formatting
    - Concepts must be separated strictly by newline characters ("\n")

  user_prompt_template: |
    Extract the key scientific concepts from the following title and abstract.

    Title:
    {title}

    Abstract:
    {abstract}
  
  top_n: 10
  batch_size: 5                            # Number of documents to process in one batch (for rate limiting)
  delay_between_batches: 1.0               # Seconds to wait between batches (for API rate limiting)
  max_retries: 3                           # Maximum retries on API failure
  retry_delay: 5.0                         # Seconds to wait before retry
